services:
  gsdm-r:
    build: .
    container_name: gsdm-r
    env_file: ./backend/.env
    volumes:
      - db-data:/app/data
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db-data:
